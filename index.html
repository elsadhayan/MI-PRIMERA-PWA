<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">

    <link rel="apple-touch-icon" href="imagenes/icons/icon-72x72.png">
    <link rel="apple-touch-icon" href="imagenes/icons/icon-96x96.png">
    <link rel="apple-touch-icon" href="imagenes/icons/icon-128x128.png">
    <link rel="apple-touch-icon" href="imagenes/icons/icon-144x144.png">
    <link rel="apple-touch-icon" href="imagenes/icons/icon-152x152.png">
    <link rel="apple-touch-icon" href="imagenes/icons/icon-192x192.png">
    <link rel="apple-touch-icon" href="imagenes/icons/icon-384x384.png">
    <link rel="apple-touch-icon" href="imagenes/icons/icon-512x512.png">
              
    <title>Coffee PWA</title>
</head>
<body>

    <nav>
        <h1>Coffee PWA</h1>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Blog</li>
        </ul>
    </nav>

    <main>
        <div class="container" id="container"></div>
    </main>

    <!-- Ventana Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span id="close-modal" class="close-btn">&times;</span>
            <img id="modal-img" src="" alt="Imagen del café">
            <h2 id="modal-title"></h2>
            <p id="modal-description"></p>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker
                    .register('./sw.js')
                    .then((reg) => console.log('Service Worker registrado con éxito:', reg.scope))
                    .catch((err) => console.error('Error al registrar el Service Worker:', err));
            });
        }
    </script>
</body>
</html>
